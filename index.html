<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Villa">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FBDDE6">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Villa</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* "Turn on notifications" card (lives on this page because iPhones only allow it here) */
  #bell { position: fixed; z-index: 5; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 10px); max-width: 460px; margin: 0 auto;
    background: #FFFFFF; color: #2E2622; border-radius: 22px; padding: 16px 16px 14px; box-shadow: 0 18px 48px rgba(90, 40, 60, .28);
    font: 15px/1.4 -apple-system, system-ui, sans-serif; transform: translateY(-140%); transition: transform .45s cubic-bezier(.2, .9, .3, 1.15); }
  #bell.show { transform: none; }
  #bell b { display: block; font: 600 18px/1.25 Georgia, serif; margin-bottom: 3px; }
  #bell p { margin: 0 0 12px; color: #6F625A; }
  #bell .row { display: flex; gap: 8px; }
  #bell button { flex: 1; border: 0; border-radius: 999px; padding: 12px 10px; font: 600 15px -apple-system, system-ui, sans-serif; cursor: pointer; }
  #bell .yes { background: linear-gradient(135deg, #F7A3B8, #E5738F); color: #fff; }
  #bell .no { background: #F5EEE6; color: #6F625A; }
  @media (prefers-color-scheme: dark) { #bell { background: #2B2023; color: #F4ECE5; } #bell p { color: #CDB3AB; } #bell .no { background: #3A2C30; color: #CDB3AB; } }

  html, body { margin: 0; height: 100%; overflow: hidden; background: #FBF1EE; }
  body { transition: background-color .6s ease; }
  /* Villa itself, full screen (below the clock/battery strip) */
  #villa { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: 0; width: 100%;
    height: calc(100% - env(safe-area-inset-top, 0px)); border: 0; background: transparent; opacity: 0; transition: opacity .5s ease; }
  #topstrip { position: fixed; left: 0; right: 0; top: 0; height: env(safe-area-inset-top, 0px); z-index: 1; transition: background-color .6s ease; }
  #villa.ready { opacity: 1; }
  /* instant pink welcome while Villa wakes up (replaces the black screen) */
  #door { position: fixed; inset: 0; display: grid; place-items: center; z-index: 2;
    background: radial-gradient(120% 75% at 50% 0%, #FBDDE6 0%, #FBF1EE 45%, #FBF7F2 100%);
    font-family: Georgia, 'Times New Roman', serif; color: #2E2622; transition: opacity .6s ease, visibility .6s ease; }
  #door.gone { opacity: 0; visibility: hidden; }
  .d-in { display: grid; justify-items: center; gap: 14px; }
  .d-ic { width: 108px; height: 108px; border-radius: 26px; box-shadow: 0 14px 34px rgba(160, 70, 100, .22); animation: dPop .6s cubic-bezier(.2, .9, .3, 1.3) both; }
  .d-name { font-size: 30px; font-weight: 600; letter-spacing: -.01em; animation: dUp .6s .2s both; }
  .d-dots { display: flex; gap: 7px; }
  .d-dots i { width: 7px; height: 7px; border-radius: 50%; background: #E5738F; opacity: .3; animation: dDot 1.2s ease-in-out infinite; }
  .d-dots i:nth-child(2) { animation-delay: .15s; } .d-dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dPop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes dUp { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes dDot { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
  @media (prefers-color-scheme: dark) {
    html, body { background: #171311; }
    #door { background: radial-gradient(120% 75% at 50% 0%, #4A2230 0%, #24181B 50%, #171311 100%); color: #F4ECE5; }
  }
  .d-msg { max-width: 300px; text-align: center; font: 15px/1.45 -apple-system, system-ui, sans-serif; color: #6F625A; display: none; }
</style>
</head>
<body>
  <div id="door">
    <div class="d-in">
      <img class="d-ic" src="apple-touch-icon.png" alt="">
      <div class="d-name">Villa</div>
      <div class="d-dots"><i></i><i></i><i></i></div>
      <div class="d-msg" id="msg">Open this page with your personal Villa link once, then add it to your Home Screen.</div>
    </div>
  </div>
  <div id="bell" role="dialog" aria-live="polite">
    <b id="bell-t">🔔 Villa notifications?</b>
    <p id="bell-p">Date reminders, when bae adds something, cycle heads-ups and a good-morning summary, right on this phone.</p>
    <div class="row" id="bell-row"><button class="no" id="bell-no" type="button">Not now</button><button class="yes" id="bell-yes" type="button">Turn on</button></div>
  </div>
  <iframe id="villa" title="Villa" allow="clipboard-read; clipboard-write; geolocation; fullscreen"></iframe>
  <script>
  (function () {
    // Villa's web app (Google Apps Script). Your personal key is NOT stored in this page;
    // it rides along in your own link (…/villa/?k=…) and is remembered only on your phone.
    var EXEC = 'https://script.google.com/macros/s/AKfycbwtf8zbnaFRm1clsb1AYrc0yvfuWB70TKn4iVZ0Y_nJ033oE7E58PYoD9AEC8u__V2bEw/exec';
    var KEY_STORE = 'villa-door-key';
    var m = /[?&]k=([a-f0-9]{64})/i.exec(location.search), key = m ? m[1].toLowerCase() : '';
    try { if (key) localStorage.setItem(KEY_STORE, key); else key = localStorage.getItem(KEY_STORE) || ''; } catch (e) { }
    var door = document.getElementById('door'), frame = document.getElementById('villa');
    if (!key) { document.querySelector('.d-dots').style.display = 'none'; document.getElementById('msg').style.display = 'block'; return; }
    var revealed = false;
    function reveal() { if (revealed) return; revealed = true; frame.classList.add('ready'); door.classList.add('gone'); setTimeout(autoBell, 5000); }
    function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
    var standaloneNow = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

    /* ---- Screen fit: Villa fills from under the clock to the very bottom edge, on any phone ---- */
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;left:0;top:0;width:1px;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
    document.body.appendChild(probe);
    function insets() { var cs = getComputedStyle(probe); return { t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0 }; }
    function screenH() {
      var h = Math.max(window.innerHeight, document.documentElement.clientHeight || 0);
      // iPhone home-screen apps can report a viewport shorter than the screen; the real screen height is reliable there
      try { if (standaloneNow && screen.height > screen.width && window.innerWidth < window.innerHeight) h = Math.max(h, screen.height); } catch (e) { }
      return h;
    }
    var direct = false;
    function layout() {
      if (!direct) return;
      var ins = insets(), h = screenH();
      frame.style.top = ins.t + 'px'; frame.style.bottom = 'auto'; frame.style.height = Math.round(h - ins.t) + 'px';
      var ts = document.getElementById('topstrip'); if (ts) ts.style.height = ins.t + 'px';
      try { var de = frame.contentDocument && frame.contentDocument.documentElement; if (de) { de.style.setProperty('--safe-b', ins.b + 'px'); de.style.setProperty('--safe-extra', '0px'); } } catch (e) { }
    }
    window.addEventListener('resize', function () { if (direct) layout(); else frame.style.height = ''; });
    window.addEventListener('orientationchange', function () { setTimeout(layout, 300); });

    /* ---- Direct mode: fetch Villa's page and show it ourselves (no Google frames → no gap, quicker) ---- */
    var SHELL_STORE = 'villa-shell-v1', touched = false, shownV = '';
    function shimFor(k) {
      // stands in for google.script.run: same calls, sent straight to Villa's server
      return '<script>window.__VILLA_DIRECT__=1;(function(){var EXEC=' + JSON.stringify(EXEC) + ';' +
        'function runner(ok,fail){return new Proxy({},{get:function(_,name){' +
        'if(name==="withSuccessHandler")return function(f){return runner(f,fail)};' +
        'if(name==="withFailureHandler")return function(f){return runner(ok,f)};' +
        'return function(){var args=Array.prototype.slice.call(arguments),tries=0;' +
        '(function go(){fetch(EXEC,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:name,args:args}),cache:"no-store",redirect:"follow"})' +
        '.then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){ok&&ok(j)})' +
        '.catch(function(e){if(++tries<2)return setTimeout(go,600);fail&&fail(e)})})()}}})}' +
        'window.google={script:{run:runner(null,null)}};})();<\/script>';
    }
    function headBits(cached) {
      var ins = insets();
      return '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' +
        '<style>:root{--safe-b:' + ins.b + 'px!important;--safe-extra:0px!important}</style>' +
        '<script>window.__VILLA_CACHED__=' + (cached ? 1 : 0) + ';<\/script>' + shimFor(key);
    }
    function show(html, cached, v) {
      direct = true; shownV = v || '';
      layout();
      frame.removeAttribute('src');
      frame.onload = function () {
        layout(); setTimeout(reveal, 150);
        try { frame.contentWindow.addEventListener('pointerdown', function () { touched = true; }, true); } catch (e) { }
      };
      var hb = headBits(cached); frame.srcdoc = html.replace(/<head>/i, function (m) { return m + hb; });
    }
    function legacy() {
      // fallback: the old way (Villa inside Google's page)
      direct = false; frame.removeAttribute('srcdoc'); frame.style.top = ''; frame.style.height = ''; frame.style.bottom = '';
      frame.onload = function () { setTimeout(reveal, 250); };
      frame.src = EXEC + '?k=' + encodeURIComponent(key);
    }
    var cache = null; try { cache = JSON.parse(ls(SHELL_STORE) || 'null'); } catch (e) { cache = null; }
    if (cache && cache.k !== key) cache = null;
    if (cache && cache.html) show(cache.html, true, cache.v);
    var t0 = Date.now(), done = false;
    var timer = setTimeout(function () { if (!done && !cache) { done = true; legacy(); } }, 20000);
    fetch(EXEC + '?shell=1&k=' + encodeURIComponent(key), { cache: 'no-store', redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok || !j.html) throw new Error('shell');
        clearTimeout(timer);
        var isApp = /id="app"/.test(j.html);
        if (isApp) ls(SHELL_STORE, JSON.stringify({ k: key, v: j.v, html: j.html, at: Date.now() })); else ls(SHELL_STORE, null);
        if (done) return; // already fell back
        done = true;
        // nothing on screen yet, or the saved copy is old code / not Villa and nobody has tapped yet → show the fresh one
        if (!cache || ((cache.v !== j.v || !isApp) && !touched && Date.now() - t0 < 6000)) show(j.html, false, j.v);
      })
      .catch(function () { if (!done && !cache) { done = true; clearTimeout(timer); legacy(); } });
    setTimeout(reveal, 15000);

    // Villa reports how tall its screen really is (old way only). Google's page around Villa can come up shorter than the frame,
    // which left a gap above the home bar, so we grow the frame by exactly the missing amount.
    function fitFrame(innerH) {
      if (direct) return;
      var vh = screenH();
      var r = frame.getBoundingClientRect(), fill = vh - r.top, missing = r.height - innerH;
      var want = Math.round(fill + Math.max(0, missing));
      if (Math.abs(r.height - want) > 1) frame.style.height = want + 'px';
    }
    var diagSent = false;
    function sendDiag(h) {
      if (diagSent || !direct) return; diagSent = true;
      var ins = insets(), r = frame.getBoundingClientRect();
      var d = { door: 2, sa: standaloneNow ? 1 : 0, ih: window.innerHeight, ch: document.documentElement.clientHeight, sh: screen.height, sw: screen.width, sat: ins.t, sab: ins.b, ft: Math.round(r.top), fh: Math.round(r.height), vh: h, ua: navigator.userAgent.slice(0, 120) };
      fetch(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'villaApi', args: [key, 'diag', d] }) }).catch(function () { });
    }
    // Villa tells us its top (sky) and bottom colors so the clock strip matches.
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!d) return;
      if (d.villa === 'push-prompt') { openBell(true); return; }
      if (d.villa === 'reload') { ls(SHELL_STORE, null); location.reload(); return; }
      if (d.villa === 'size' && typeof d.h === 'number') { fitFrame(d.h); setTimeout(function () { sendDiag(d.h); }, 2500); return; }
      if (d.villa !== 'colors') return;
      var ok = function (c) { return c && /^(#[0-9a-f]{3,8}|rgb\([\d,\s]+\))$/i.test(String(c).trim()); };
      if (ok(d.top)) { var ts = document.getElementById('topstrip'); if (!ts) { ts = document.createElement('div'); ts.id = 'topstrip'; document.body.appendChild(ts); if (direct) layout(); } ts.style.backgroundColor = d.top; }
      if (ok(d.bottom)) document.body.style.backgroundColor = String(d.bottom).trim();
    });

    /* ---------- Phone notifications ---------- */
    var bell = document.getElementById('bell'), bellT = document.getElementById('bell-t'), bellP = document.getElementById('bell-p');
    var bellYes = document.getElementById('bell-yes'), bellNo = document.getElementById('bell-no');
    var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    var canPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    var vapidKey = '';
    var swReady = canPush ? navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; }) : null;
    function getVapid() {
      return vapidKey ? Promise.resolve(vapidKey) : fetch(EXEC + '?vapid=1', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) { vapidKey = j.key; return vapidKey; });
    }
    function b64uToBytes(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var bin = atob(s), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
    function strToB64u(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
    function say(t, p, buttons) { bellT.textContent = t; bellP.textContent = p; document.getElementById('bell-row').style.display = buttons ? 'flex' : 'none'; bell.classList.add('show'); if (!buttons) setTimeout(function () { bell.classList.remove('show'); }, 5000); }
    function saveSub(sub) {
      var j = sub.toJSON(), data = strToB64u(JSON.stringify({ endpoint: j.endpoint, keys: j.keys }));
      return fetch(EXEC + '?pushsub=' + data + '&k=' + key + '&ua=' + encodeURIComponent(navigator.userAgent.slice(0, 100)), { cache: 'no-store' })
        .then(function (r) { return r.json(); }).then(function (res) {
          if (!res || !res.ok) throw new Error(res && res.error || 'save');
          try { localStorage.setItem('villa-push-saved', String(Date.now())); } catch (e) { }
          return res;
        });
    }
    function subscribe() {
      return Promise.all([swReady, getVapid()]).then(function (v) {
        var reg = v[0];
        return reg.pushManager.getSubscription().then(function (s) {
          return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(v[1]) });
        });
      }).then(saveSub);
    }
    function openBell(fromVilla) {
      if (!canPush || !standalone) {
        if (fromVilla) say('📲 One quick thing', 'Open Villa from its home-screen icon (not a Safari tab), then turn notifications on from there.', false);
        return;
      }
      if (Notification.permission === 'denied') { say('🔕 Notifications are off', 'Turn them on in iPhone Settings ▸ Notifications ▸ Villa.', false); return; }
      if (Notification.permission === 'granted') { say('💕 Notifications are on', 'Sending a test to this phone…', false); subscribe().catch(function () { say('Hmm, that didn’t work', 'Try again in a minute.', false); }); return; }
      getVapid().catch(function () { });
      bellT.textContent = '🔔 Villa notifications?';
      bellP.textContent = 'Date reminders, when bae adds something, cycle heads-ups and a good-morning summary, right on this phone.';
      document.getElementById('bell-row').style.display = 'flex';
      bell.classList.add('show');
    }
    function autoBell() {
      if (!canPush || !standalone) return;
      if (Notification.permission === 'granted') {
        // keep this phone registered (quietly re-saves about once a week)
        var last = 0; try { last = +localStorage.getItem('villa-push-saved') || 0; } catch (e) { }
        if (Date.now() - last > 7 * 86400000) subscribe().catch(function () { });
        return;
      }
      if (Notification.permission !== 'default') return;
      var later = 0; try { later = +localStorage.getItem('villa-push-later') || 0; } catch (e) { }
      if (Date.now() - later < 3 * 86400000) return;
      openBell(false);
    }
    bellNo.addEventListener('click', function () { bell.classList.remove('show'); try { localStorage.setItem('villa-push-later', String(Date.now())); } catch (e) { } });
    bellYes.addEventListener('click', function () {
      // iPhone only allows this right inside the tap
      var ask = Notification.requestPermission();
      bellYes.textContent = 'One sec…';
      Promise.resolve(ask).then(function (perm) {
        if (perm !== 'granted') { bellYes.textContent = 'Turn on'; say('🔕 No worries', 'You can turn them on later in Villa ▸ Phone notifications.', false); return; }
        return subscribe().then(function () {
          bellYes.textContent = 'Turn on';
          say('You’re all set 💕', 'A test notification is on its way.', false);
        });
      }).catch(function () { bellYes.textContent = 'Turn on'; say('Hmm, that didn’t work', 'Try again from Villa ▸ Phone notifications.', false); });
    });
  })();
  </script>
</body>
</html>
