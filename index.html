<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Villa">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FBDDE6">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Villa</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #FBF1EE; }
  body { transition: background-color .6s ease; }
  /* Villa itself, full screen (below the clock/battery strip) */
  #villa { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: 0; width: 100%;
    height: calc(100% - env(safe-area-inset-top, 0px)); border: 0; background: transparent; opacity: 0; transition: opacity .5s ease; }
  #villa.ready { opacity: 1; }
  /* instant pink welcome while Villa wakes up (replaces the black screen) */
  #door { position: fixed; inset: 0; display: grid; place-items: center; z-index: 2;
    background: radial-gradient(120% 75% at 50% 0%, #FBDDE6 0%, #FBF1EE 45%, #FBF7F2 100%);
    font-family: Georgia, 'Times New Roman', serif; color: #2E2622; transition: opacity .6s ease, visibility .6s ease; }
  #door.gone { opacity: 0; visibility: hidden; }
  .d-in { display: grid; justify-items: center; gap: 14px; }
  .d-ic { width: 108px; height: 108px; border-radius: 26px; box-shadow: 0 14px 34px rgba(160, 70, 100, .22); animation: dPop .6s cubic-bezier(.2, .9, .3, 1.3) both; }
  .d-name { font-size: 30px; font-weight: 600; letter-spacing: -.01em; animation: dUp .6s .2s both; }
  .d-dots { display: flex; gap: 7px; }
  .d-dots i { width: 7px; height: 7px; border-radius: 50%; background: #E5738F; opacity: .3; animation: dDot 1.2s ease-in-out infinite; }
  .d-dots i:nth-child(2) { animation-delay: .15s; } .d-dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dPop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes dUp { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes dDot { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
  @media (prefers-color-scheme: dark) {
    html, body { background: #171311; }
    #door { background: radial-gradient(120% 75% at 50% 0%, #4A2230 0%, #24181B 50%, #171311 100%); color: #F4ECE5; }
  }
  .d-msg { max-width: 300px; text-align: center; font: 15px/1.45 -apple-system, system-ui, sans-serif; color: #6F625A; display: none; }
</style>
</head>
<body>
  <div id="door">
    <div class="d-in">
      <img class="d-ic" src="apple-touch-icon.png" alt="">
      <div class="d-name">Villa</div>
      <div class="d-dots"><i></i><i></i><i></i></div>
      <div class="d-msg" id="msg">Open this page with your personal Villa link once, then add it to your Home Screen.</div>
    </div>
  </div>
  <iframe id="villa" title="Villa" allow="clipboard-read; clipboard-write; geolocation; fullscreen"></iframe>
  <script>
  (function () {
    // Villa's web app (Google Apps Script). Your personal key is NOT stored in this page;
    // it rides along in your own link (…/villa/?k=…) and is remembered only on your phone.
    var EXEC = 'https://script.google.com/macros/s/AKfycbwtf8zbnaFRm1clsb1AYrc0yvfuWB70TKn4iVZ0Y_nJ033oE7E58PYoD9AEC8u__V2bEw/exec';
    var KEY_STORE = 'villa-door-key';
    var m = /[?&]k=([a-f0-9]{64})/i.exec(location.search), key = m ? m[1].toLowerCase() : '';
    try { if (key) localStorage.setItem(KEY_STORE, key); else key = localStorage.getItem(KEY_STORE) || ''; } catch (e) { }
    var door = document.getElementById('door'), frame = document.getElementById('villa');
    if (!key) { document.querySelector('.d-dots').style.display = 'none'; document.getElementById('msg').style.display = 'block'; return; }
    function reveal() { frame.classList.add('ready'); door.classList.add('gone'); }
    frame.addEventListener('load', function () { setTimeout(reveal, 250); });
    setTimeout(reveal, 12000);
    frame.src = EXEC + '?k=' + encodeURIComponent(key);
    // Villa tells us its top (sky) and bottom colors so the clock strip matches.
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!d || d.villa !== 'colors') return;
      if (d.top && /^(#[0-9a-f]{3,8}|rgb\([\d,\s]+\))$/i.test(d.top)) document.body.style.backgroundColor = d.top;
    });
  })();
  </script>
</body>
</html>
